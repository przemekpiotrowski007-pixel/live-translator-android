name: Build LiveTranslator APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: unzip -o live-translator-android-github.zip

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        run: gradle :app:assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Gotowy APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
